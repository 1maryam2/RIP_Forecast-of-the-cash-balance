<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashFlow - Возврат от поставщика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/accountPage.css">
</head>
<body>
    <div class="container">
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <a href="/mainPage" class="logo">
                <span class="logo-cash">Cash</span><span class="logo-flow">Flow</span>
                </a>
            </div>
        </div>
    </header>
    <main class="main-content">        
        <div class="details-card">
            <a href="/mainPage" class="back-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 0 24 24" width="28px" fill="#FFFFFF"><path d="M0 0h24v24H0z" fill="none"/><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <div class="card-title-group">
                <img src="{{ .account.Image }}" alt="{{ .account.Title }}" class="details-icon">
                <h1>{{ .account.Title }}</h1>
            </div>
            <p>{{ .account.Description }}</p>
        </div>
    </main>
    
    <footer class="footer">
        <div class="footer-content">
            <p>© 2025 CashFlow. Все права защищены.</p>
        </div>
    </footer>
</div>
</body>
</html>
